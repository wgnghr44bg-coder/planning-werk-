const KEY = "planning-sleutel";
const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
async function open(key) {
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b(P.iv) }, key, b(P.data));
  const html = new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
async function fromPass(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b(P.salt), iterations: P.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
(async () => {
  // eerder onthouden? dan direct openen
  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || "null");
    if (saved && saved.salt === P.salt) {
      const key = await crypto.subtle.importKey("raw", b(saved.k), { name: "AES-GCM" }, false, ["decrypt"]);
      await open(key); return;
    }
  } catch (e) { try { localStorage.removeItem(KEY); } catch (e2) {} }
  const f = document.getElementById("f"); f.hidden = false; document.getElementById("pw").focus();
  f.addEventListener("submit", async e => {
    e.preventDefault();
    const go = document.getElementById("go"), msg = document.getElementById("msg");
    go.disabled = true; msg.textContent = ""; go.textContent = "Openen…";
    try {
      const key = await fromPass(document.getElementById("pw").value);
      if (document.getElementById("keep").checked) {
        try { localStorage.setItem(KEY, JSON.stringify({ salt: P.salt, k: b64(await crypto.subtle.exportKey("raw", key)) })); } catch (e) {}
      }
      await open(key);
    } catch (err) {
      try { localStorage.removeItem(KEY); } catch (e) {}
      go.disabled = false; go.textContent = "Openen"; msg.textContent = "Verkeerd wachtwoord. Probeer het opnieuw.";
      document.getElementById("pw").select();
    }
  });
})();
</script>
